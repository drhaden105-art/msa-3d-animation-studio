name: Deploy Sibling Studios to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix episode card layout in source
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.assets,.mediaGrid,.episodegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}'
          new = '.assets,.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.episodegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;align-items:start;width:100%;min-width:0}'
          if old in s:
              s = s.replace(old, new, 1)
          extra = '''<style id="episode-card-responsive-fix">
          .episodegrid{display:grid !important;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)) !important;gap:22px !important;width:100% !important;align-items:start !important}
          .episode{width:100% !important;min-width:0 !important;padding:0 !important;overflow:hidden !important}
          .episode .thumb{display:flex !important;width:100% !important;aspect-ratio:16/9 !important;height:auto !important;min-height:0 !important;overflow:hidden !important}
          .episode .info{padding:14px !important}
          @media(max-width:700px){.episodegrid{grid-template-columns:1fr !important}.episode{width:100% !important}}
          </style>'''
          if 'id="episode-card-responsive-fix"' not in s:
              s = s.replace('</head>', extra + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source change needed"
          else
            git commit -m "Fix episode card layout [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
