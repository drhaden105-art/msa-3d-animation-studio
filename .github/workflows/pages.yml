name: Deploy Sibling Studios to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix episode card layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.assets,.mediaGrid,.episodegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.asset,.mediaCard,.episode{background:#090d29;border:1px solid #343c72;border-radius:9px;overflow:hidden;padding:10px;cursor:pointer}.mediaThumb,.thumb{height:145px;background:linear-gradient(135deg,#1b2855,#070a19);display:flex;align-items:center;justify-content:center;font-size:44px}'
          new = '.assets,.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.episodegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;align-items:start}.asset,.mediaCard,.episode{background:#090d29;border:1px solid #343c72;border-radius:9px;overflow:hidden;padding:10px;cursor:pointer}.episode{min-width:0}.mediaThumb{height:145px;background:linear-gradient(135deg,#1b2855,#070a19);display:flex;align-items:center;justify-content:center;font-size:44px}.thumb{width:100%;aspect-ratio:16/9;height:auto;min-height:0;background:linear-gradient(135deg,#1b2855,#070a19);display:flex;align-items:center;justify-content:center;font-size:44px;object-fit:cover}'
          if old not in s:
              raise SystemExit('Expected episode layout CSS was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
